; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; MOT ENV DUY NHAT cho firmware. Doi giua WiFi / 4G / AUTO bang cach sua
; NET_MODE trong include/net_mode.h — KHONG doi env, KHONG can clean.
;
; Build/nap:  pio run -t upload && pio device monitor
; OTA:        pio run  &&  python ota.py

[env:esp32-s3-devkitm-1]
platform = espressif32
board = dfrobot_firebeetle2_esp32s3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
; BAT BUOC cho OTA: bang phan vung phai co ota_0/ota_1/otadata.
; default.csv (4MB) = 2 slot app 1.31MB + spiffs 1.5MB.
; KHONG duoc dung huge_app.csv — chi 1 slot app, mat OTA hoan toan.
; Neu board la ban 16MB: doi sang default_16MB.csv va them
;   board_upload.flash_size = 16MB / board_upload.maximum_size = 16777216
board_build.partitions = default.csv
build_src_filter = -<*> +<base_rtk.cpp>
build_flags =
	-DDEBUG
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	knolleary/PubSubClient@^2.8
	vshymanskyy/TinyGSM@^0.12.0

[env:release]
extends = env:esp32-s3-devkitm-1
build_type = release
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
